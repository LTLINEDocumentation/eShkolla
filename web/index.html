<!doctype html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eShkolla Web</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>eShkolla</h1>
        <p>Platformë për menaxhimin e shkollës</p>
      </div>
      <span id="status" class="status">Demo</span>
    </header>

    <section id="login" class="card login-card">
      <h2>Hyr në sistem</h2>
      <label>Përdoruesi<input id="username" autocomplete="username" placeholder="p.sh. admin"></label>
      <label>Fjalëkalimi<input id="password" type="password" autocomplete="current-password" placeholder="••••••"></label>
      <button id="loginButton">Hyr</button>
      <p id="error" class="error"></p>
      <small>Demo: të gjithë përdoruesit përdorin fjalëkalimin <strong>123456</strong>.</small>
    </section>

    <section id="dashboard" class="hidden">
      <div class="dashboard-head card">
        <div>
          <p class="eyebrow">Paneli kryesor</p>
          <h2 id="welcome"></h2>
          <p id="roleDescription" class="muted"></p>
        </div>
        <button id="logoutButton" class="secondary">Dil</button>
      </div>

      <div id="stats" class="stats"></div>
      <div id="modules" class="module-grid"></div>

      <section class="card">
        <div class="section-title">
          <div>
            <p class="eyebrow">Aktivitetet</p>
            <h3>Gjendja e sistemit</h3>
          </div>
        </div>
        <div id="activityList" class="activity-list"></div>
      </section>

      <section class="card profile-card">
        <div>
          <p class="eyebrow">Llogaria</p>
          <h3>Profili</h3>
        </div>
        <div id="profile" class="profile-grid"></div>
      </section>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
