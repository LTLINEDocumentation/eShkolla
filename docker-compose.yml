services:
  postgres:
    image: postgres:17
    container_name: eshkolla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eshkolla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eshkolla_pgdata:/var/lib/postgresql/data

volumes:
  eshkolla_pgdata:
