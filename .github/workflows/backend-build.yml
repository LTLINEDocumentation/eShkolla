name: Backend Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'settings.gradle.kts'
      - '.github/workflows/backend-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'settings.gradle.kts'
      - '.github/workflows/backend-build.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test backend
        run: gradle :backend:test
